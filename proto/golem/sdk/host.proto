syntax = "proto3";

package golem.sdk;

import "golem/sdk/media.proto";
import "golem/sdk/model.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/golemwx/sdk/internal/wire;wire";

// AccountResponse 返回当前唯一账号快照。
message AccountResponse {
  Account account = 1;
  Error error = 2;
}

// SendTextRequest 向联系人或群发送文本。
message SendTextRequest {
  string target = 1;
  string text = 2;
  repeated string mentions = 3;
}

// SendAppRequest 向联系人或群发送应用消息。
message SendAppRequest {
  string target = 1;
  AppData app = 2;
}

// SendMediaMetadata 是媒体上传流首包的业务元数据。
message SendMediaMetadata {
  string target = 1;
  MessageType type = 2;
  string name = 3;
  int64 size = 4;
  VoiceUpload voice = 5;
}

// SendMediaRequest 是媒体上传流的首包元数据或后续字节。
message SendMediaRequest {
  oneof value {
    SendMediaMetadata metadata = 1;
    bytes data = 2;
  }
}

// SendResultResponse 返回真实发送结果。
message SendResultResponse {
  SendResult result = 1;
  Error error = 2;
}

// ForwardRequest 使用完整源消息转发。
message ForwardRequest {
  string target = 1;
  Message source = 2;
}

// RevokeRequest 使用真实发送结果撤回。
message RevokeRequest {
  SendResult sent = 1;
}

// DownloadRequest 使用完整消息携带的 ID 和类型化媒体数据下载。
message DownloadRequest {
  Message source = 1;
}

// ContactFindRequest 按策略选择器查询联系人。
message ContactFindRequest {
  string selector = 1;
}

// ContactResponse 返回单个联系人。
message ContactResponse {
  Contact contact = 1;
  Error error = 2;
}

// ChatroomGetRequest 查询群专属资料。
message ChatroomGetRequest {
  string username = 1;
}

// ChatroomResponse 返回群资料。
message ChatroomResponse {
  Chatroom chatroom = 1;
  Error error = 2;
}

// ChatroomMembersRequest 查询群成员快照。
message ChatroomMembersRequest {
  string username = 1;
}

// ChatroomMembersResponse 返回群成员快照。
message ChatroomMembersResponse {
  repeated Member members = 1;
  Error error = 2;
}

// AcquireLeaseRequest 申请联系人或整个群的消费租约。
message AcquireLeaseRequest {
  string target = 1;
  repeated string topics = 2;
}

// RenewLeaseRequest 续期当前插件持有的租约。
message RenewLeaseRequest {
  string lease_id = 1;
  google.protobuf.Duration ttl = 2;
}

// ReleaseLeaseRequest 释放当前插件持有的租约。
message ReleaseLeaseRequest {
  string lease_id = 1;
}

// LeaseResponse 返回租约状态。
message LeaseResponse {
  Lease lease = 1;
  Error error = 2;
}

// CallCapabilityRequest 按能力名发起跨插件调用。
message CallCapabilityRequest {
  CapabilityRequest request = 1;
}

// CallCapabilityResponse 返回有界内联能力结果。
message CallCapabilityResponse {
  CapabilityResult result = 1;
  Error error = 2;
}

// ReadConfigResponse 返回当前插件自己的持久化配置。
message ReadConfigResponse {
  BytesValue config = 1;
  Error error = 2;
}

// SaveConfigRequest 保存当前插件自己的配置子节。
message SaveConfigRequest {
  BytesValue config = 1;
}

// HostAccountService 提供当前账号快照。
service HostAccountService {
  // Current 返回当前唯一账号业务快照。
  rpc Current(google.protobuf.Empty) returns (AccountResponse);
}

// HostMessagesService 提供无业务引用表的消息能力。
service HostMessagesService {
  // SendText 发送文本消息。
  rpc SendText(SendTextRequest) returns (SendResultResponse);
  // SendApp 发送应用消息。
  rpc SendApp(SendAppRequest) returns (SendResultResponse);
  // SendMedia 通过首包元数据和后续字节分块发送媒体。
  rpc SendMedia(stream SendMediaRequest) returns (SendResultResponse);
  // Forward 使用完整源消息转发。
  rpc Forward(ForwardRequest) returns (SendResultResponse);
  // Revoke 使用真实发送结果撤回。
  rpc Revoke(RevokeRequest) returns (OperationResponse);
  // Download 按完整消息的元数据下载媒体字节流；终止业务错误位于 DownloadResponse.error。
  rpc Download(DownloadRequest) returns (stream DownloadResponse);
}

// HostContactsService 提供联系人策略查询。
service HostContactsService {
  // Find 按 username、nickname 或 remark 策略精确查询。
  rpc Find(ContactFindRequest) returns (ContactResponse);
}

// HostChatroomsService 提供群资料和成员查询。
service HostChatroomsService {
  // Get 返回群专属资料。
  rpc Get(ChatroomGetRequest) returns (ChatroomResponse);
  // Members 返回宿主缓存中的群成员快照。
  rpc Members(ChatroomMembersRequest) returns (ChatroomMembersResponse);
}

// HostSessionsService 提供联系人或整群租约。
service HostSessionsService {
  // Acquire 申请联系人或整个群的指定主题租约。
  rpc Acquire(AcquireLeaseRequest) returns (LeaseResponse);
  // Renew 续期当前插件持有的租约。
  rpc Renew(RenewLeaseRequest) returns (LeaseResponse);
  // Release 释放当前插件持有的租约。
  rpc Release(ReleaseLeaseRequest) returns (OperationResponse);
}

// HostCallerService 提供跨插件能力路由。
service HostCallerService {
  // Call 按能力名调用，由宿主选择提供者。
  rpc Call(CallCapabilityRequest) returns (CallCapabilityResponse);
}

// HostConfigService 提供当前插件自身配置的持久化入口。
service HostConfigService {
  // Read 读取当前插件自己的配置。
  rpc Read(google.protobuf.Empty) returns (ReadConfigResponse);
  // Save 仅更新当前插件自己的 config 子节。
  rpc Save(SaveConfigRequest) returns (OperationResponse);
}
