syntax = "proto3";

package golem.sdk;

import "golem/sdk/media.proto";
import "golem/sdk/model.proto";
import "golem/sdk/plugin.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/golemwx/sdk/internal/wire;wire";

// Invocation 宿主反向调用的执行身份凭据
message Invocation {
  // id 关联执行的唯一标识
  string id = 1;
  // token 绑定当前执行身份的宿主签发凭据
  string token = 2;
}

// SendTextRequest 文本消息发送请求
message SendTextRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // text 待发送的文本内容
  string text = 3;
  // mentions 被提及者的微信 username 列表
  repeated string mentions = 4;
}

// ReplyRequest 引用回复请求
message ReplyRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // quote 引用消息摘要，缺失时为空
  Quote quote = 3;
  // text 引用回复的文本内容
  string text = 4;
}

// SendReceiptResponse 消息发送回执响应
message SendReceiptResponse {
  // receipt 消息发送回执，写结果未知时不得据此认定成功
  SendReceipt receipt = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// RevokeRequest 消息撤回请求
message RevokeRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // ref 待撤回消息的宿主签发引用
  RevokeRef ref = 2;
}

// SendMediaMetadata 媒体上传流首包的调用身份和业务元数据
message SendMediaMetadata {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // kind 业务种类，未知枚举归一为对应零值
  MediaKind kind = 3;
  // file_name 展示用文件名及扩展名，不得用于拼接宿主路径
  string file_name = 4;
  // size 待上传媒体字节数，-1 代表未知
  int64 size = 5;
  // ref 复用的宿主管理媒体引用，不传插件本地路径
  MediaRef ref = 6;
  // voice 语音时长与编码参数，非语音媒体时为空
  VoiceOptions voice = 7;
}

// SendMediaRequest 媒体上传流中的元数据或字节分块
message SendMediaRequest {
  // value 上传流包体，首包为元数据，后续包为字节分块
  oneof value {
    // metadata 上传流首包元数据，必须先于字节分块发送
    SendMediaMetadata metadata = 1;
    // data 媒体上传字节分块，单块不超过 MaxMediaChunkSize
    bytes data = 2;
  }
}

// DownloadRequest 宿主管理的媒体下载请求
message DownloadRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // media 宿主管理的媒体引用
  MediaRef media = 2;
}

// ContactGetRequest 指定联系人查询请求
message ContactGetRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // username 微信 username，不另建用户标识
  string username = 2;
}

// ContactFindRequest 按昵称或备注查询联系人的分页请求
message ContactFindRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // query 昵称或备注的字面子串，空字符串等同列表查询
  string query = 2;
  // page 有界分页请求或分页业务结果
  PageRequest page = 3;
}

// ContactListRequest 联系人列表分页请求
message ContactListRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // page 有界分页请求或分页业务结果
  PageRequest page = 2;
}

// ContactRefreshRequest 显式批量刷新联系人请求
message ContactRefreshRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // usernames 需要显式刷新的联系人微信 username，结果保持输入顺序
  repeated string usernames = 2;
}

// ContactResponse 单个联系人查询响应
message ContactResponse {
  // contact 变更或查询对应的联系人业务快照
  Contact contact = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ContactPageResponse 联系人分页查询响应
message ContactPageResponse {
  // page 有界分页请求或分页业务结果
  ContactPage page = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ContactBatchResponse 联系人批量刷新响应
message ContactBatchResponse {
  // result 业务处理结果，失败时结合 error 判断
  ContactBatchResult result = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ChatroomGetRequest 指定群资料查询请求
message ChatroomGetRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // room_username 群的微信 username
  string room_username = 2;
}

// ChatroomMembersRequest 群成员列表分页请求
message ChatroomMembersRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // room_username 群的微信 username
  string room_username = 2;
  // page 有界分页请求或分页业务结果
  PageRequest page = 3;
}

// ChatroomMemberRequest 指定群成员查询请求
message ChatroomMemberRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // room_username 群的微信 username
  string room_username = 2;
  // user_username 群成员的微信 username
  string user_username = 3;
}

// ChatroomRefreshRequest 显式刷新群资料及成员请求
message ChatroomRefreshRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // room_username 群的微信 username
  string room_username = 2;
}

// RoomResponse 单个群资料查询响应
message RoomResponse {
  // room 变更或查询对应的群业务快照
  Room room = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// MemberResponse 单个群成员查询响应
message MemberResponse {
  // member 变更或查询对应的群成员业务快照
  Member member = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// MemberPageResponse 群成员分页查询响应
message MemberPageResponse {
  // page 有界分页请求或分页业务结果
  MemberPage page = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ChatroomRefreshResponse 群资料及成员刷新响应
message ChatroomRefreshResponse {
  // result 业务处理结果，失败时结合 error 判断
  ChatroomRefreshResult result = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// SessionAcquireRequest 联系人或整群会话租约申请请求
message SessionAcquireRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // topics 租约覆盖的事件主题，作用于联系人或整个群
  repeated string topics = 3;
}

// SessionRenewRequest 会话租约续期请求
message SessionRenewRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // lease_id 当前插件持有的会话租约标识
  string lease_id = 2;
  // ttl 租约续期时长，受宿主允许范围约束
  google.protobuf.Duration ttl = 3;
}

// SessionReleaseRequest 会话租约释放请求
message SessionReleaseRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // lease_id 当前插件持有的会话租约标识
  string lease_id = 2;
}

// LeaseResponse 会话租约操作响应
message LeaseResponse {
  // lease 关联的会话租约
  Lease lease = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// HostCallRequest 经宿主路由的跨插件能力调用请求
message HostCallRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // request 待处理的按能力名调用请求
  CallRequest request = 2;
}

// HostCallResponse 经宿主路由的跨插件能力调用响应
message HostCallResponse {
  // result 业务处理结果，失败时结合 error 判断
  CallResult result = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ConfigSnapshotRequest 插件自身配置快照查询请求
message ConfigSnapshotRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
}

// ConfigSnapshotResponse 插件自身配置快照响应
message ConfigSnapshotResponse {
  // snapshot 插件自身已保存配置及当前生效修订的快照
  ConfigSnapshot snapshot = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ConfigSaveRequest 按预期修订号保存插件自身配置的请求
message ConfigSaveRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
  // expected_revision 保存时预期的当前修订号，不匹配时返回 Conflict
  uint64 expected_revision = 2;
  // data 插件自身业务配置字节，缺失与显式空字节可区分
  BytesValue data = 3;
}

// ConfigSaveResponse 插件自身配置保存响应
message ConfigSaveResponse {
  // result 业务处理结果，失败时结合 error 判断
  ConfigSaveResult result = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// AccountCurrentRequest 当前账号业务快照查询请求
message AccountCurrentRequest {
  // invocation 本次反向调用绑定的执行身份凭据
  Invocation invocation = 1;
}

// AccountResponse 当前账号业务快照响应
message AccountResponse {
  // account 变更或查询对应的当前账号业务快照
  Account account = 1;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 2;
}

// ExecutionCompletedRequest 插件处理函数实际结束后的受控执行确认
message ExecutionCompletedRequest {
  // control_token 绑定插件实例的控制通道凭据，不作为业务参数暴露
  string control_token = 1;
  // invocation_id 关联执行的唯一标识
  string invocation_id = 2;
  // instance_generation 插件实例代次，用于拒绝旧实例请求
  uint64 instance_generation = 3;
}

// ReverseReadyRequest 插件反向宿主连接就绪确认
message ReverseReadyRequest {
  // control_token 绑定插件实例的控制通道凭据，不作为业务参数暴露
  string control_token = 1;
}

// HostMessagesService 宿主消息发送、撤回及媒体下载服务
service HostMessagesService {
  // SendText 向指定业务会话发送文本消息
  rpc SendText(SendTextRequest) returns (SendReceiptResponse);
  // SendMedia 通过首包元数据和后续字节分块发送媒体
  rpc SendMedia(stream SendMediaRequest) returns (SendReceiptResponse);
  // Reply 向指定业务会话发送引用回复
  rpc Reply(ReplyRequest) returns (SendReceiptResponse);
  // Revoke 使用宿主签发的撤回引用撤回消息
  rpc Revoke(RevokeRequest) returns (OperationResponse);
  // Download 按媒体引用下载有界字节分块流
  rpc Download(DownloadRequest) returns (stream MediaChunk);
}

// HostContactsService 宿主联系人只读查询和显式刷新服务
service HostContactsService {
  // Get 查询本地联系人资料，缺失不隐式回源
  rpc Get(ContactGetRequest) returns (ContactResponse);
  // Find 按昵称或备注的字面子串查询本地联系人并稳定分页
  rpc Find(ContactFindRequest) returns (ContactPageResponse);
  // List 分页查询本地联系人，缺失不隐式回源
  rpc List(ContactListRequest) returns (ContactPageResponse);
  // Refresh 显式刷新指定联系人并保留逐项结果
  rpc Refresh(ContactRefreshRequest) returns (ContactBatchResponse);
}

// HostChatroomsService 宿主群资料、成员查询和显式刷新服务
service HostChatroomsService {
  // Get 查询本地群资料，缺失不隐式回源
  rpc Get(ChatroomGetRequest) returns (RoomResponse);
  // Members 分页查询本地群成员，缺失不隐式回源
  rpc Members(ChatroomMembersRequest) returns (MemberPageResponse);
  // Member 查询本地指定群成员，缺失不隐式回源
  rpc Member(ChatroomMemberRequest) returns (MemberResponse);
  // Refresh 显式刷新群资料及成员并保留各阶段结果
  rpc Refresh(ChatroomRefreshRequest) returns (ChatroomRefreshResponse);
}

// HostSessionsService 宿主联系人及整群会话租约服务
service HostSessionsService {
  // Acquire 按联系人或整个群申请指定主题的会话租约
  rpc Acquire(SessionAcquireRequest) returns (LeaseResponse);
  // Renew 为当前插件持有的会话租约续期
  rpc Renew(SessionRenewRequest) returns (LeaseResponse);
  // Release 释放当前插件持有的会话租约
  rpc Release(SessionReleaseRequest) returns (OperationResponse);
}

// HostCallerService 宿主按能力名路由的跨插件调用服务
service HostCallerService {
  // Call 按能力名调用，由宿主选择提供者
  rpc Call(HostCallRequest) returns (HostCallResponse);
}

// HostConfigService 宿主插件自身业务配置服务
service HostConfigService {
  // Snapshot 读取插件自身业务配置快照
  rpc Snapshot(ConfigSnapshotRequest) returns (ConfigSnapshotResponse);
  // Save 按预期修订号保存配置，保存接受不代表已应用
  rpc Save(ConfigSaveRequest) returns (ConfigSaveResponse);
}

// HostAccountService 宿主当前账号业务快照服务
service HostAccountService {
  // Current 读取当前账号业务快照
  rpc Current(AccountCurrentRequest) returns (AccountResponse);
}

// HostControlService 宿主反向连接就绪及执行完成确认服务
service HostControlService {
  // ReverseReady 使用控制凭据确认反向宿主连接已就绪
  rpc ReverseReady(ReverseReadyRequest) returns (OperationResponse);
  // ExecutionCompleted 在处理函数实际结束后确认执行完成，RPC 返回或超时不能代替此确认
  rpc ExecutionCompleted(ExecutionCompletedRequest) returns (OperationResponse);
}
