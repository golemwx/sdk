syntax = "proto3";

package golem.sdk;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/golemwx/sdk/internal/wire;wire";

// Category 是可跨进程稳定判断的错误类别。
enum Category {
  CATEGORY_UNKNOWN = 0;
  CATEGORY_INVALID_ARGUMENT = 1;
  CATEGORY_PERMISSION_DENIED = 2;
  CATEGORY_NOT_FOUND = 3;
  CATEGORY_FAILED_PRECONDITION = 4;
  CATEGORY_RESOURCE_EXHAUSTED = 5;
  CATEGORY_UNIMPLEMENTED = 6;
  CATEGORY_DEADLINE_EXCEEDED = 7;
  CATEGORY_CANCELED = 8;
  CATEGORY_UNAVAILABLE = 9;
  CATEGORY_INTERNAL = 10;
}

// WriteOutcome 描述有副作用的写入结果。
enum WriteOutcome {
  WRITE_OUTCOME_UNSPECIFIED = 0;
  WRITE_OUTCOME_NOT_APPLICABLE = 1;
  WRITE_OUTCOME_SUCCEEDED = 2;
  WRITE_OUTCOME_FAILED = 3;
  WRITE_OUTCOME_UNKNOWN = 4;
}

// Error 是脱敏的跨进程业务错误。
message Error {
  Category category = 1;
  string operation = 2;
  WriteOutcome outcome = 3;
  string reason = 4;
  google.protobuf.Duration retry_after = 5;
}

// BytesValue 保留缺失和显式空字节的区别。
message BytesValue {
  bytes value = 1;
}

// ContactKind 是宿主已确认的联系人种类。
enum ContactKind {
  CONTACT_KIND_UNKNOWN = 0;
  CONTACT_KIND_PERSONAL = 1;
  CONTACT_KIND_ROOM = 2;
  CONTACT_KIND_OFFICIAL = 3;
  CONTACT_KIND_SELF = 4;
}

// Contact 是联系人或消息参与者的业务快照。
message Contact {
  string username = 1;
  ContactKind kind = 2;
  string nickname = 3;
  string remark = 4;
}

// Chatroom 是群专属资料快照。
message Chatroom {
  string username = 1;
  string name = 2;
  string remark = 3;
  string owner_username = 4;
}

// Member 是群成员快照，也用于表示群消息实际发言者。
message Member {
  string username = 1;
  string chatroom = 2;
  string display_name = 3;
  string nickname = 4;
}

// MessageType 是消息业务类型。
enum MessageType {
  MESSAGE_TYPE_UNKNOWN = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_VOICE = 3;
  MESSAGE_TYPE_VIDEO = 4;
  MESSAGE_TYPE_EMOJI = 5;
  MESSAGE_TYPE_LOCATION = 6;
  MESSAGE_TYPE_APP = 7;
  MESSAGE_TYPE_FILE = 8;
}

// TextData 表示文本消息；正文保存在 Message.content。
message TextData {}

// MediaData 是媒体下载和转发所需的真实字段，不是业务 token。
message MediaData {
  string file_id = 1;
  string md5 = 2;
  string key = 3;
  string url = 4;
  uint64 size = 5;
}

// ImageData 是图片消息的结构化数据。
message ImageData {
  MediaData media = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// VoiceData 是语音消息的结构化数据。
message VoiceData {
  MediaData media = 1;
  google.protobuf.Duration duration = 2;
  string format = 3;
}

// VideoData 是视频消息的结构化数据。
message VideoData {
  MediaData media = 1;
  google.protobuf.Duration duration = 2;
  string thumbnail_url = 3;
  string thumbnail_key = 4;
  uint64 thumbnail_size = 5;
  string new_md5 = 6;
}

// EmojiData 是表情消息的结构化数据。
message EmojiData {
  string md5 = 1;
  string url = 2;
  uint64 size = 3;
}

// LocationData 是位置消息的结构化数据。
message LocationData {
  double x = 1;
  double y = 2;
  string label = 3;
  string poi_name = 4;
}

// AppData 是应用消息的结构化数据。
message AppData {
  uint32 type = 1;
  string title = 2;
  string description = 3;
  string url = 4;
}

// FileData 是文件消息的结构化数据。
message FileData {
  MediaData media = 1;
  string name = 2;
  string extension = 3;
  string app_id = 4;
  string attach_id = 5;
}

// Message 是 frame 投递和插件引用的完整消息。
message Message {
  uint64 id = 1;
  MessageType type = 2;
  Contact sender = 3;
  Contact receiver = 4;
  Member member = 5;
  string content = 6;
  BytesValue raw = 7;
  google.protobuf.Timestamp timestamp = 8;

  // data 是唯一的类型化消息数据来源。
  oneof data {
    TextData text = 10;
    ImageData image = 11;
    VoiceData voice = 12;
    VideoData video = 13;
    EmojiData emoji = 14;
    LocationData location = 15;
    AppData app = 16;
    FileData file = 17;
  }
}

// SendResult 是足以构造撤回请求的真实发送结果。
message SendResult {
  uint64 id = 1;
  uint64 new_id = 2;
  string client_id = 3;
  Contact sender = 4;
  Contact receiver = 5;
  MessageType type = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp server_time = 8;
  WriteOutcome outcome = 9;
}

// SubscriptionMode 是插件订阅模式。
enum SubscriptionMode {
  SUBSCRIPTION_MODE_UNKNOWN = 0;
  SUBSCRIPTION_MODE_OBSERVE = 1;
  SUBSCRIPTION_MODE_CONSUME = 2;
}

// Subscription 是单个事件订阅。
message Subscription {
  string topic = 1;
  SubscriptionMode mode = 2;
  int32 priority = 3;
}

// Event 是一次函数调用的不可变输入。
message Event {
  string topic = 1;
  Message message = 2;
  Contact contact = 3;
  Chatroom chatroom = 4;
  Member member = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// EventResult 是消费者返回的消费结果。
message EventResult {
  bool consumed = 1;
}

// CommandScope 是命令执行所需的权限范围。
enum CommandScope {
  COMMAND_SCOPE_UNKNOWN = 0;
  COMMAND_SCOPE_USER = 1;
  COMMAND_SCOPE_OWNER = 2;
}

// CommandArgument 是命令参数描述。
message CommandArgument {
  string name = 1;
  string short = 2;
  bool positional = 3;
  string type = 4;
  bool required = 5;
  bool repeated = 6;
  string default_value = 7;
  repeated string enum_values = 8;
  string help = 9;
}

// CommandNode 是命令树节点。
message CommandNode {
  string name = 1;
  repeated string aliases = 2;
  string help = 3;
  CommandScope scope = 4;
  repeated CommandArgument arguments = 5;
  repeated CommandNode children = 6;
}

// CommandSchema 是自动生成的完整命令树。
message CommandSchema {
  repeated CommandNode roots = 1;
}

// CommandInvocation 是 frame 交给插件的原始命令输入。
message CommandInvocation {
  repeated string tokens = 1;
  string raw = 2;
  Message message = 3;
  bool owner = 4;
}

// CapabilitySpec 是插件公开能力描述。
message CapabilitySpec {
  string name = 1;
  string description = 2;
  string input_type = 3;
  string output_type = 4;
  int32 max_inline_size = 5;
}

// CapabilityRequest 是跨插件能力请求。
message CapabilityRequest {
  string name = 1;
  string content_type = 2;
  BytesValue payload = 3;
}

// CapabilityResult 是有界内联能力结果。
message CapabilityResult {
  string content_type = 1;
  BytesValue payload = 2;
}

// Lease 是联系人或整个群的事件消费租约。
message Lease {
  string id = 1;
  string target = 2;
  repeated string topics = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Account 是当前唯一账号快照。
message Account {
  string username = 1;
  string nickname = 2;
  bool online = 3;
}

// Metadata 是插件固定元数据。
message Metadata {
  string id = 1;
  string name = 2;
  string description = 3;
  string author = 4;
  string version = 5;
}

// Descriptor 是 SDK 自动汇总的插件描述。
message Descriptor {
  Metadata metadata = 1;
  repeated Subscription subscriptions = 2;
  CommandSchema commands = 3;
  repeated CapabilitySpec capabilities = 4;
  bool has_config = 5;
  BytesValue default_config = 6;
}

// OperationResponse 是仅携带业务错误的通用响应。
message OperationResponse {
  Error error = 1;
}
