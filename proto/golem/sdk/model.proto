syntax = "proto3";

package golem.sdk;

import "golem/sdk/media.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/golemwx/sdk/internal/wire;wire";

// Category 可机器判断的错误类别
enum Category {
  // CATEGORY_UNKNOWN 未知错误类别
  CATEGORY_UNKNOWN = 0;
  // CATEGORY_INVALID_ARGUMENT 请求参数无效
  CATEGORY_INVALID_ARGUMENT = 1;
  // CATEGORY_PERMISSION_DENIED 调用方无权执行操作
  CATEGORY_PERMISSION_DENIED = 2;
  // CATEGORY_NOT_FOUND 请求的业务对象或能力不存在
  CATEGORY_NOT_FOUND = 3;
  // CATEGORY_ALREADY_EXISTS 目标业务对象已存在
  CATEGORY_ALREADY_EXISTS = 4;
  // CATEGORY_CONFLICT 修订号或业务状态冲突
  CATEGORY_CONFLICT = 5;
  // CATEGORY_FAILED_PRECONDITION 未初始化、引用失效或其他业务前置条件不满足
  CATEGORY_FAILED_PRECONDITION = 6;
  // CATEGORY_RESOURCE_EXHAUSTED 调用额度或资源预算耗尽
  CATEGORY_RESOURCE_EXHAUSTED = 7;
  // CATEGORY_UNIMPLEMENTED 声明的方法尚未实现
  CATEGORY_UNIMPLEMENTED = 8;
  // CATEGORY_DEADLINE_EXCEEDED 调用已超过截止时间
  CATEGORY_DEADLINE_EXCEEDED = 9;
  // CATEGORY_CANCELED 调用已取消
  CATEGORY_CANCELED = 10;
  // CATEGORY_UNAVAILABLE 依赖或服务暂不可用
  CATEGORY_UNAVAILABLE = 11;
  // CATEGORY_INTERNAL 内部错误或上游响应违反契约
  CATEGORY_INTERNAL = 12;
}

// WriteOutcome 写操作副作用结果
enum WriteOutcome {
  // WRITE_OUTCOME_UNSPECIFIED 未指定或未知结果，不能据此认定写入成功
  WRITE_OUTCOME_UNSPECIFIED = 0;
  // WRITE_OUTCOME_NOT_APPLICABLE 只读操作，不涉及目标写入副作用
  WRITE_OUTCOME_NOT_APPLICABLE = 1;
  // WRITE_OUTCOME_SUCCEEDED 上游已明确确认目标写入成功
  WRITE_OUTCOME_SUCCEEDED = 2;
  // WRITE_OUTCOME_FAILED 已确认目标写入未完成
  WRITE_OUTCOME_FAILED = 3;
  // WRITE_OUTCOME_UNKNOWN 目标写入可能已生效，调用方不得自动重试
  WRITE_OUTCOME_UNKNOWN = 4;
}

// Completeness 当前资料或查询范围的完整性
enum Completeness {
  // COMPLETENESS_UNKNOWN 资料或查询范围的完整性未知
  COMPLETENESS_UNKNOWN = 0;
  // COMPLETENESS_INCOMPLETE 资料或查询范围尚不完整，不得据此授予管理权限
  COMPLETENESS_INCOMPLETE = 1;
  // COMPLETENESS_COMPLETE 资料或查询范围已完整，与是否还有下一页无关
  COMPLETENESS_COMPLETE = 2;
}

// AccountStatus 账号业务状态
enum AccountStatus {
  // ACCOUNT_STATUS_UNKNOWN 账号状态未知
  ACCOUNT_STATUS_UNKNOWN = 0;
  // ACCOUNT_STATUS_UNLOGGED 账号未登录
  ACCOUNT_STATUS_UNLOGGED = 1;
  // ACCOUNT_STATUS_LOGGED_IN 账号已登录
  ACCOUNT_STATUS_LOGGED_IN = 2;
  // ACCOUNT_STATUS_ONLINE 账号在线
  ACCOUNT_STATUS_ONLINE = 3;
  // ACCOUNT_STATUS_OFFLINE 账号离线
  ACCOUNT_STATUS_OFFLINE = 4;
}

// ConversationKind 会话种类
enum ConversationKind {
  // CONVERSATION_KIND_UNKNOWN 未知会话种类
  CONVERSATION_KIND_UNKNOWN = 0;
  // CONVERSATION_KIND_DIRECT 联系人私聊会话
  CONVERSATION_KIND_DIRECT = 1;
  // CONVERSATION_KIND_ROOM 整个群共用的群会话
  CONVERSATION_KIND_ROOM = 2;
}

// ActorResolution 实际发言者解析结果
enum ActorResolution {
  // ACTOR_RESOLUTION_UNKNOWN 发言者解析状态未知
  ACTOR_RESOLUTION_UNKNOWN = 0;
  // ACTOR_RESOLUTION_RESOLVED 已从群消息中解析出实际成员
  ACTOR_RESOLUTION_RESOLVED = 1;
  // ACTOR_RESOLUTION_DIRECT 已确定私聊消息的实际发言者
  ACTOR_RESOLUTION_DIRECT = 2;
  // ACTOR_RESOLUTION_SYSTEM 系统消息，不对应实际发言者
  ACTOR_RESOLUTION_SYSTEM = 3;
  // ACTOR_RESOLUTION_PARSE_FAILED 实际发言者解析失败，不得用群身份代替
  ACTOR_RESOLUTION_PARSE_FAILED = 4;
  // ACTOR_RESOLUTION_NO_SENDER 消息未提供发言者
  ACTOR_RESOLUTION_NO_SENDER = 5;
}

// ContactKind 联系人类型
enum ContactKind {
  // CONTACT_KIND_UNKNOWN 未知联系人类型
  CONTACT_KIND_UNKNOWN = 0;
  // CONTACT_KIND_FRIEND 好友联系人
  CONTACT_KIND_FRIEND = 1;
  // CONTACT_KIND_ROOM 群联系人
  CONTACT_KIND_ROOM = 2;
  // CONTACT_KIND_OFFICIAL 公众号联系人
  CONTACT_KIND_OFFICIAL = 3;
  // CONTACT_KIND_SELF 账号自身
  CONTACT_KIND_SELF = 4;
}

// MemberRole 群成员角色
enum MemberRole {
  // MEMBER_ROLE_UNKNOWN 群成员角色未知，不得据此授予管理权限
  MEMBER_ROLE_UNKNOWN = 0;
  // MEMBER_ROLE_OWNER 已确认的群主
  MEMBER_ROLE_OWNER = 1;
  // MEMBER_ROLE_MEMBER 普通群成员
  MEMBER_ROLE_MEMBER = 2;
  // MEMBER_ROLE_ADMIN 已确认的群管理员，首期没有可靠来源时不产出
  MEMBER_ROLE_ADMIN = 3;
}

// Direction 消息方向
enum Direction {
  // DIRECTION_UNKNOWN 未知消息方向
  DIRECTION_UNKNOWN = 0;
  // DIRECTION_INBOUND 入站消息
  DIRECTION_INBOUND = 1;
  // DIRECTION_OUTBOUND 出站消息
  DIRECTION_OUTBOUND = 2;
}

// MessageKind 消息种类
enum MessageKind {
  // MESSAGE_KIND_UNKNOWN 未知消息种类
  MESSAGE_KIND_UNKNOWN = 0;
  // MESSAGE_KIND_TEXT 文本消息
  MESSAGE_KIND_TEXT = 1;
  // MESSAGE_KIND_IMAGE 图片消息
  MESSAGE_KIND_IMAGE = 2;
  // MESSAGE_KIND_VOICE 语音消息
  MESSAGE_KIND_VOICE = 3;
  // MESSAGE_KIND_VIDEO 视频消息
  MESSAGE_KIND_VIDEO = 4;
  // MESSAGE_KIND_FILE 文件消息
  MESSAGE_KIND_FILE = 5;
  // MESSAGE_KIND_EMOJI 表情消息
  MESSAGE_KIND_EMOJI = 6;
  // MESSAGE_KIND_LINK 链接消息
  MESSAGE_KIND_LINK = 7;
  // MESSAGE_KIND_APP 应用消息
  MESSAGE_KIND_APP = 8;
  // MESSAGE_KIND_NOTE 笔记消息
  MESSAGE_KIND_NOTE = 9;
  // MESSAGE_KIND_RECORD 聊天记录消息
  MESSAGE_KIND_RECORD = 10;
  // MESSAGE_KIND_MUSIC 音乐消息
  MESSAGE_KIND_MUSIC = 11;
  // MESSAGE_KIND_POSITION 位置消息
  MESSAGE_KIND_POSITION = 12;
  // MESSAGE_KIND_NAME_CARD 名片消息
  MESSAGE_KIND_NAME_CARD = 13;
  // MESSAGE_KIND_SYSTEM 系统消息
  MESSAGE_KIND_SYSTEM = 14;
}

// ChangeDomain 资料变更域
enum ChangeDomain {
  // CHANGE_DOMAIN_UNKNOWN 未知资料变更域
  CHANGE_DOMAIN_UNKNOWN = 0;
  // CHANGE_DOMAIN_CONTACT 联系人资料变更
  CHANGE_DOMAIN_CONTACT = 1;
  // CHANGE_DOMAIN_ROOM 群资料变更
  CHANGE_DOMAIN_ROOM = 2;
  // CHANGE_DOMAIN_ROOM_MEMBER 群成员资料变更
  CHANGE_DOMAIN_ROOM_MEMBER = 3;
  // CHANGE_DOMAIN_ACCOUNT 当前账号资料变更
  CHANGE_DOMAIN_ACCOUNT = 4;
}

// ChangeAction 资料变更动作
enum ChangeAction {
  // CHANGE_ACTION_UNKNOWN 未知变更动作
  CHANGE_ACTION_UNKNOWN = 0;
  // CHANGE_ACTION_CREATED 业务对象已创建
  CHANGE_ACTION_CREATED = 1;
  // CHANGE_ACTION_UPDATED 业务对象已更新
  CHANGE_ACTION_UPDATED = 2;
  // CHANGE_ACTION_DELETED 业务对象已删除
  CHANGE_ACTION_DELETED = 3;
}

// ApplyStatus 配置应用状态
enum ApplyStatus {
  // APPLY_STATUS_UNKNOWN 配置应用状态未知
  APPLY_STATUS_UNKNOWN = 0;
  // APPLY_STATUS_PENDING 配置已保存，尚待应用
  APPLY_STATUS_PENDING = 1;
  // APPLY_STATUS_APPLIED 已保存配置已成功应用
  APPLY_STATUS_APPLIED = 2;
  // APPLY_STATUS_FAILED 配置应用失败，保留此前生效配置
  APPLY_STATUS_FAILED = 3;
}

// StringList 保留缺失与显式空列表区别的字符串集合
message StringList {
  // values 显式存在的字符串集合，允许空列表
  repeated string values = 1;
}

// BytesValue 保留缺失与显式空字节区别的字节载荷
message BytesValue {
  // value 显式存在的字节载荷，允许零长度字节
  bytes value = 1;
}

// Error 跨进程业务错误
message Error {
  // category 机器判断的错误类别，不通过匹配 Reason 判断
  Category category = 1;
  // operation 发生错误的业务操作名
  string operation = 2;
  // invocation_id 关联执行的唯一标识
  string invocation_id = 3;
  // outcome 目标写入副作用结果，只读操作使用 NotApplicable
  WriteOutcome outcome = 4;
  // reason 供人阅读的脱敏错误说明，不用于机器分支判断
  string reason = 5;
  // retry_after 建议重试等待时长，不构成自动重试写操作的授权
  google.protobuf.Duration retry_after = 6;
}

// PageRequest 有界分页请求
message PageRequest {
  // limit 每页条数，0 使用默认 100，最大 1000，负数无效
  int32 limit = 1;
  // cursor 不透明分页游标，空字符串从头开始，续页时原样回传
  string cursor = 2;
}

// Account 当前账号业务快照
message Account {
  // username 微信 username，不另建用户标识
  string username = 1;
  // nickname 昵称，缺失与显式空字符串可区分
  optional string nickname = 2;
  // online 账号当前是否在线
  bool online = 3;
  // status 账号业务状态
  AccountStatus status = 4;
  // updated_at 资料快照更新时间，必填并按 UTC 传递
  google.protobuf.Timestamp updated_at = 5;
}

// Conversation 账号内的业务会话
message Conversation {
  // account_username 所属账号的微信 username
  string account_username = 1;
  // kind 业务种类，未知枚举归一为对应零值
  ConversationKind kind = 2;
  // id 私聊对端或群的微信 username，不能使用群成员 ID 代替群会话
  string id = 3;
}

// Actor 实际发言者
message Actor {
  // username 微信 username，不另建用户标识
  string username = 1;
  // display_name 展示名称，缺失与显式空字符串可区分
  optional string display_name = 2;
  // resolution 实际发言者解析状态
  ActorResolution resolution = 3;
}

// Contact 联系人业务快照
message Contact {
  // username 微信 username，不另建用户标识
  string username = 1;
  // kind 业务种类，未知枚举归一为对应零值
  ContactKind kind = 2;
  // nickname 昵称，缺失与显式空字符串可区分
  optional string nickname = 3;
  // remark 备注，缺失与显式空字符串可区分
  optional string remark = 4;
  // avatar_url 头像地址，缺失与显式空字符串可区分
  optional string avatar_url = 5;
  // alias 微信号别名，缺失与显式空字符串可区分
  optional string alias = 6;
  // updated_at 资料快照更新时间，必填并按 UTC 传递
  google.protobuf.Timestamp updated_at = 7;
  // completeness 对象或查询范围的资料完整性，与分页是否结束无关
  Completeness completeness = 8;
}

// Room 群业务快照
message Room {
  // username 微信 username，不另建用户标识
  string username = 1;
  // name 群名称，缺失与显式空字符串可区分
  optional string name = 2;
  // remark 备注，缺失与显式空字符串可区分
  optional string remark = 3;
  // owner_username 群主的微信 username，未知时缺失
  optional string owner_username = 4;
  // announcement 群公告，缺失与显式空字符串可区分
  optional string announcement = 5;
  // announcement_version 修改群公告时原样回传的并发前置版本，未知时缺失
  optional int32 announcement_version = 6;
  // member_count 群成员数量，未知时缺失，显式 0 与缺失可区分
  optional int32 member_count = 7;
  // updated_at 资料快照更新时间，必填并按 UTC 传递
  google.protobuf.Timestamp updated_at = 8;
  // completeness 对象或查询范围的资料完整性，与分页是否结束无关
  Completeness completeness = 9;
}

// Member 群成员业务快照
message Member {
  // room_username 群的微信 username
  string room_username = 1;
  // user_username 群成员的微信 username
  string user_username = 2;
  // display_name 展示名称，缺失与显式空字符串可区分
  optional string display_name = 3;
  // nickname 昵称，缺失与显式空字符串可区分
  optional string nickname = 4;
  // role 已确认的群成员角色，未知角色不得用于授予管理权限
  MemberRole role = 5;
  // joined_at 入群时间，未知时缺失，有值时按 UTC 传递
  google.protobuf.Timestamp joined_at = 6;
  // completeness 对象或查询范围的资料完整性，与分页是否结束无关
  Completeness completeness = 7;
}

// Quote 引用消息摘要
message Quote {
  // message_id 微信消息 ID，以字符串原样保存，避免大整数精度丢失
  string message_id = 1;
  // actor_username 实际发言者的微信 username
  string actor_username = 2;
  // digest 引用消息的展示摘要
  string digest = 3;
}

// Message 归一化业务消息
message Message {
  // id 微信消息 ID，以字符串原样保存，避免大整数精度丢失
  string id = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // actor 实际发言者，无法确定或没有发言者时为空
  Actor actor = 3;
  // actor_resolution 实际发言者解析结果，解析失败时不以群身份代替
  ActorResolution actor_resolution = 4;
  // direction 消息的入站或出站方向
  Direction direction = 5;
  // kind 业务种类，未知枚举归一为对应零值
  MessageKind kind = 6;
  // created_at 消息创建时间，必填并按 UTC 传递
  google.protobuf.Timestamp created_at = 7;
  // text 文本内容，缺失与显式空字符串可区分
  optional string text = 8;
  // mentions 被提及者的微信 username 列表，缺失与显式空集合可区分
  StringList mentions = 9;
  // quote 引用消息摘要，缺失时为空
  Quote quote = 10;
  // media 宿主管理的媒体引用
  MediaRef media = 11;
}

// SendReceipt 消息发送结果
message SendReceipt {
  // message_id 微信消息 ID，以字符串原样保存，避免大整数精度丢失
  string message_id = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // sent_at 消息发送时间，必填并按 UTC 传递
  google.protobuf.Timestamp sent_at = 3;
  // outcome 目标写入副作用结果，只读操作使用 NotApplicable
  WriteOutcome outcome = 4;
  // revoke_ref 由宿主签发的撤回引用，无法提供时为空
  RevokeRef revoke_ref = 5;
}

// Change 归一化资料变更
message Change {
  // domain 资料变更所属业务域
  ChangeDomain domain = 1;
  // action 资料创建、更新或删除动作
  ChangeAction action = 2;
  // subject_id 本项操作或资料变更的目标业务标识
  string subject_id = 3;
  // parent_id 父级业务标识，群成员变更时为群 username
  optional string parent_id = 4;
  // changed_fields 实际变更的 SDK 字段路径，更新时非空，缺失与显式空集合可区分
  StringList changed_fields = 5;
  // contact 变更或查询对应的联系人业务快照
  Contact contact = 6;
  // room 变更或查询对应的群业务快照
  Room room = 7;
  // member 变更或查询对应的群成员业务快照
  Member member = 8;
  // account 变更或查询对应的当前账号业务快照
  Account account = 9;
}

// Lease 联系人或整群的会话租约
message Lease {
  // id 由宿主签发的会话租约标识
  string id = 1;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 2;
  // topics 租约覆盖的事件主题，作用于联系人或整个群
  repeated string topics = 3;
  // expires_at 会话租约到期时间，到期后不再持有会话
  google.protobuf.Timestamp expires_at = 4;
}

// Event 投递给插件的不可变事件
message Event {
  // topic 订阅或投递的事件主题
  string topic = 1;
  // account_username 所属账号的微信 username
  string account_username = 2;
  // message 关联的归一化业务消息
  Message message = 3;
  // change 关联的资料变更，非资料变更事件时为空
  Change change = 4;
  // lease 关联的会话租约
  Lease lease = 5;
  // occurred_at 事件发生时间，必填并按 UTC 传递
  google.protobuf.Timestamp occurred_at = 6;
}

// EventResult 事件消费结果
message EventResult {
  // consumed 普通响应链是否已消费事件，观察者结果不影响路由
  bool consumed = 1;
}

// Command 已完成词法、权限与参数校验的命令
message Command {
  // path 由各级命令名称组成的路径
  repeated string path = 1;
  // args 已完成校验的命名参数值
  map<string, string> args = 2;
  // positional 按输入顺序保留的位置参数
  repeated string positional = 3;
  // actor 实际发言者，无法确定或没有发言者时为空
  Actor actor = 4;
  // message 关联的归一化业务消息
  Message message = 5;
  // raw 原始命令文本
  string raw = 6;
}

// CommandResult 命令执行结果
message CommandResult {
  // replied 命令处理函数是否已经自行回复
  bool replied = 1;
  // text 文本内容，缺失与显式空字符串可区分
  optional string text = 2;
  // media 宿主管理的媒体引用
  MediaRef media = 3;
}

// CallRequest 按能力名发起的跨插件调用请求
message CallRequest {
  // capability_name 目标能力名，由宿主选择提供者，不指定插件 ID
  string capability_name = 1;
  // content_type 载荷内容类型
  string content_type = 2;
  // payload 内联业务载荷，缺失与显式空字节可区分
  BytesValue payload = 3;
  // actor 实际发言者，无法确定或没有发言者时为空
  Actor actor = 4;
  // conversation 所属或目标业务会话，群内所有成员共用整群会话
  Conversation conversation = 5;
}

// CallResult 跨插件能力调用结果
message CallResult {
  // content_type 载荷内容类型
  string content_type = 1;
  // payload 内联结果载荷，与 media 互斥，缺失与显式空字节可区分
  BytesValue payload = 2;
  // media 宿主管理的结果媒体引用，与 payload 互斥
  MediaRef media = 3;
}

// ConfigSnapshot 插件业务配置快照
message ConfigSnapshot {
  // revision 已保存配置的修订号，不能据此认定配置已生效
  uint64 revision = 1;
  // active_revision 当前已生效配置的修订号
  uint64 active_revision = 2;
  // data 插件自身业务配置字节，缺失与显式空字节可区分
  BytesValue data = 3;
  // apply_status 已保存配置的应用状态
  ApplyStatus apply_status = 4;
}

// ConfigSaveResult 配置保存接受结果，不代表已经应用
message ConfigSaveResult {
  // revision 已保存配置的修订号，不能据此认定配置已生效
  uint64 revision = 1;
}

// ContactPage 联系人分页结果
message ContactPage {
  // items 当前页联系人，成功的空结果使用显式空集合
  repeated Contact items = 1;
  // next_cursor 下一页不透明游标，空字符串说明没有更多结果
  string next_cursor = 2;
  // total 当前授权范围的总条数，-1 代表未知
  int64 total = 3;
  // completeness 对象或查询范围的资料完整性，与分页是否结束无关
  Completeness completeness = 4;
}

// MemberPage 群成员分页结果
message MemberPage {
  // items 当前页群成员，成功的空结果使用显式空集合
  repeated Member items = 1;
  // next_cursor 下一页不透明游标，空字符串说明没有更多结果
  string next_cursor = 2;
  // total 当前授权范围的总条数，-1 代表未知
  int64 total = 3;
  // completeness 对象或查询范围的资料完整性，与分页是否结束无关
  Completeness completeness = 4;
}

// ContactBatchItem 单个联系人刷新结果
message ContactBatchItem {
  // subject_id 本项操作或资料变更的目标业务标识
  string subject_id = 1;
  // value 单项业务值，仅在 Error 为空时读取
  Contact value = 2;
  // outcome 目标写入副作用结果，只读操作使用 NotApplicable
  WriteOutcome outcome = 3;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 4;
}

// ContactBatchResult 按输入顺序保留逐项状态的联系人批量结果
message ContactBatchResult {
  // items 按输入顺序保留的逐项联系人刷新结果
  repeated ContactBatchItem items = 1;
}

// RefreshStageResult 单个上游只读刷新阶段的结果
message RefreshStageResult {
  // name 上游只读刷新阶段名称
  string name = 1;
  // outcome 目标写入副作用结果，只读操作使用 NotApplicable
  WriteOutcome outcome = 2;
  // error 业务错误，成功时为空；部分成功仍保留逐项结果
  Error error = 3;
}

// ChatroomRefreshResult 群资料及成员的分阶段刷新结果
message ChatroomRefreshResult {
  // room 变更或查询对应的群业务快照
  Room room = 1;
  // members 群成员分页结果
  MemberPage members = 2;
  // stages 各上游只读刷新阶段的独立结果
  repeated RefreshStageResult stages = 3;
}
