syntax = "proto3";

package golem.sdk;

import "golem/sdk/model.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/golemwx/sdk/internal/wire;wire";

// DownloadResponse 是媒体下载流的分块或终止错误。
//
// 每个成功分块只设置 data；终止业务错误只设置 error 且必须是最后一个包。
// 传输层中断仍使用 gRPC status。
message DownloadResponse {
  oneof value {
    bytes data = 1;
    Error error = 2;
  }
}

// VoiceUpload 是语音发送所需的业务参数。
message VoiceUpload {
  google.protobuf.Duration duration = 1;
  string format = 2;
}
