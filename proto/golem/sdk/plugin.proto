syntax = "proto3";

package golem.sdk;

import "golem/sdk/model.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/golemwx/sdk/internal/wire;wire";

// DescribeResponse 返回 SDK 自动汇总的插件描述。
message DescribeResponse {
  Descriptor descriptor = 1;
  Error error = 2;
}

// InitializeRequest 绑定插件实例的宿主连接和数据根路径。
message InitializeRequest {
  uint32 broker_id = 1;
  BytesValue config = 2;
  string data_root = 3;
}

// ValidateConfigRequest 请求 SDK 严格解码并校验候选配置。
message ValidateConfigRequest {
  BytesValue candidate = 1;
}

// SetConfigRequest 请求 SDK 校验、赋值并触发配置变更通知。
message SetConfigRequest {
  BytesValue config = 1;
}

// HandleEventRequest 投递一个瞬时事件。
message HandleEventRequest {
  Event event = 1;
}

// EventResponse 返回消费结果。
message EventResponse {
  EventResult result = 1;
  Error error = 2;
}

// HandleCommandRequest 投递原始命令输入。
message HandleCommandRequest {
  CommandInvocation command = 1;
}

// HandleCapabilityRequest 投递跨插件能力调用。
message HandleCapabilityRequest {
  CapabilityRequest request = 1;
}

// CapabilityResponse 返回能力结果。
message CapabilityResponse {
  CapabilityResult result = 1;
  Error error = 2;
}

// PluginControlService 是插件描述、初始化、配置和生命周期控制面。
service PluginControlService {
  // Describe 返回元数据、订阅、自动命令树、能力和默认配置。
  rpc Describe(google.protobuf.Empty) returns (DescribeResponse);
  // Initialize 绑定唯一 Host 连接和插件数据根路径。
  rpc Initialize(InitializeRequest) returns (OperationResponse);
  // Load 执行可选 OnLoad。
  rpc Load(google.protobuf.Empty) returns (OperationResponse);
  // Start 执行可选 OnStart 并建立启用期 context。
  rpc Start(google.protobuf.Empty) returns (OperationResponse);
  // Stop 执行可选 OnStop 并取消启用期 context。
  rpc Stop(google.protobuf.Empty) returns (OperationResponse);
  // Unload 执行可选 OnUnload 并释放实例资源。
  rpc Unload(google.protobuf.Empty) returns (OperationResponse);
  // ValidateConfig 严格解码和校验候选配置，不修改当前状态。
  rpc ValidateConfig(ValidateConfigRequest) returns (OperationResponse);
  // SetConfig 校验、发布并触发配置变更通知。
  rpc SetConfig(SetConfigRequest) returns (OperationResponse);
}

// PluginBusinessService 是插件业务入口。
service PluginBusinessService {
  // HandleEvent 处理一次事件投递。
  rpc HandleEvent(HandleEventRequest) returns (EventResponse);
  // HandleCommand 处理一次命令。
  rpc HandleCommand(HandleCommandRequest) returns (OperationResponse);
  // HandleCapability 处理一次能力调用。
  rpc HandleCapability(HandleCapabilityRequest) returns (CapabilityResponse);
}
